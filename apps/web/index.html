<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadbook · Sign in</title>
<link rel="stylesheet" href="/src/shell.css">
<script>
  // Injected at build time. For local dev, copy config.example.js → config.js
  // and edit. config.js is gitignored.
</script>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/src/supabase-client.js"></script>
</head>
<body>
<div class="landing">
  <div class="landing-card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="3" rx="1"/><rect x="3" y="11" width="13" height="3" rx="1"/><rect x="3" y="16" width="8" height="3" rx="1"/></svg>
    </div>
    <h1>Plan your roadmap</h1>
    <p>A simple, fast roadmap builder for product managers. Drag chips across swim lanes, share as PNG or link, save to your account.</p>
    <button class="btn-google" id="signIn">
      <span class="g-icon">
        <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.997 8.997 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
      </span>
      Continue with Google
    </button>
    <div class="fineprint">
      Your roadmaps are private to you. Free forever for personal use.
    </div>
  </div>
</div>
<script>
  RoadbookAuth.bounceIfAuthed();
  document.getElementById("signIn").addEventListener("click", () => {
    RoadbookAuth.signInWithGoogle();
  });
</script>
</body>
</html>
