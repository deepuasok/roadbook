<body data-theme="light" class="cloud-mode">
<script>window.__suppressFirstRun = true;</script>

<div class="editor-shell">
  <div class="left">
    <a class="back" href="/app.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4L6 8l4 4"/></svg>
      All roadmaps
    </a>
    <span class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="3" rx="1"/><rect x="3" y="11" width="13" height="3" rx="1"/><rect x="3" y="16" width="8" height="3" rx="1"/></svg>
      </span>
      Roadbook
    </span>
  </div>
  <div class="right">
    <span class="save-pill" id="savePill"><span class="dot"></span><span id="savePillLabel">Loading…</span></span>
    <button class="shell-btn" id="inviteBtn" hidden type="button" title="Invite people to collaborate">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><path d="M1.5 14a4.5 4.5 0 019 0"/><path d="M12 5v6M9 8h6"/></svg>
      <span>Invite</span>
    </button>
    <div class="avatar" id="shellAvatar"></div>
  </div>
</div>

<!-- INJECT:ENGINE_BODY -->

<!-- ===== Share modal (owner only) ===== -->
<div class="collab-overlay" id="shareOverlay" role="dialog" aria-modal="true" hidden>
  <div class="collab-card">
    <h3>Share roadmap</h3>
    <div class="sub">Share a link (no email needed) or invite by email. People sign in with Google. Editors change the roadmap directly; proposers suggest changes you approve. You stay the owner.</div>

    <div class="collab-section-title">Share a link</div>
    <div class="collab-invite-row">
      <select id="shareLinkRole" aria-label="Link access level">
        <option value="editor">Anyone with link can edit</option>
        <option value="proposer">Anyone with link can propose</option>
      </select>
      <button class="collab-btn primary" id="shareLinkCreate" type="button">Create link</button>
    </div>
    <div class="sharelink-banner collab-row" id="shareLinkResult" hidden>
      <div class="who">
        <span class="name">Share link</span>
        <small class="sharelink-url"></small>
      </div>
      <button class="collab-btn sharelink-copy" type="button">Copy</button>
    </div>
    <div class="collab-list" id="shareLinksList"></div>

    <div class="collab-section-title">Invite by email</div>
    <div class="collab-invite-row">
      <input type="email" id="inviteEmail" placeholder="name@example.com" autocomplete="off">
      <button class="collab-btn primary" id="inviteSend" type="button">Invite</button>
    </div>
    <div class="collab-error" id="inviteError"></div>

    <div class="collab-section-title">People with access</div>
    <div class="collab-list" id="collabList">
      <div class="collab-empty">Loading…</div>
    </div>

    <div class="collab-actions">
      <button class="collab-btn" id="shareClose" type="button">Done</button>
    </div>
  </div>
</div>

<!-- ===== Comments panel (slides in from right) ===== -->
<div class="comments-panel" id="commentsPanel" aria-hidden="true">
  <div class="comments-head">
    <div class="comments-title" id="commentsTitle">Comments</div>
    <button class="comments-close" id="commentsClose" type="button" aria-label="Close">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="comments-list" id="commentsList"></div>
  <div class="comments-compose">
    <textarea id="commentInput" rows="2" placeholder="Add a comment…"></textarea>
    <button class="collab-btn primary" id="commentSend" type="button">Comment</button>
  </div>
</div>
