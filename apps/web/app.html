<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Roadmaps · Roadbook</title>
<link rel="stylesheet" href="/src/shell.css">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/src/supabase-client.js"></script>
<script src="/src/roadmaps-api.js"></script>
<script src="/templates.js"></script>
</head>
<body>
<div class="dash-shell">

  <header class="dash-header">
    <div class="dash-brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="3" rx="1"/><rect x="3" y="11" width="13" height="3" rx="1"/><rect x="3" y="16" width="8" height="3" rx="1"/></svg>
      </div>
      <div class="wordmark">Roadbook</div>
    </div>
    <div class="dash-user">
      <div class="avatar" id="userAvatar"></div>
      <span class="email" id="userEmail"></span>
      <button class="btn-ghost" id="signOut">Sign out</button>
    </div>
  </header>

  <h1 class="dash-title">My roadmaps</h1>
  <p class="dash-sub" id="dashSub">Loading…</p>

  <div class="dash-grid" id="grid"></div>

  <div id="sharedSection" hidden>
    <h2 class="shared-section-title" style="font-size:14px;font-weight:600;color:#52525b;text-transform:uppercase;letter-spacing:0.05em;margin:36px 0 14px;">Shared with me</h2>
    <div class="dash-grid" id="sharedGrid"></div>
  </div>

</div>

<!-- Template picker for new roadmap -->
<div class="modal-overlay" id="tplOverlay" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>Start a new roadmap</h3>
    <div class="sub">Pick a starter or start blank. You can rename it anytime.</div>
    <div class="tpl-grid" id="tplGrid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="tplCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Rename modal -->
<div class="modal-overlay" id="renameOverlay" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>Rename roadmap</h3>
    <div class="sub">Give it a name that'll be easy to spot in your list.</div>
    <input type="text" id="renameInput" style="width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:9px; font-size:14px; font-family:inherit;">
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn-cancel" id="renameCancel">Cancel</button>
      <button class="btn-primary" id="renameSave">Save</button>
    </div>
  </div>
</div>

<!-- Import modal -->
<div class="modal-overlay" id="importOverlay" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>Import roadmap</h3>
    <div class="sub">Drop a Roadbook JSON file, paste JSON, or paste a URL we can fetch.</div>

    <div style="margin-top:12px;">
      <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
      <button class="btn-cancel" type="button" id="importChooseFile" style="width:100%;">Choose JSON file…</button>
      <div id="importFileName" style="font-size:12px; color:var(--text-dim); margin-top:6px; min-height:16px;"></div>
    </div>

    <div style="display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--text-dim); font-size:12px;">
      <div style="flex:1; height:1px; background:var(--border);"></div>
      <span>or paste below</span>
      <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>

    <textarea id="importText" rows="6" placeholder='Paste JSON, or a URL like https://…/scene.json' style="width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:9px; font-size:12.5px; font-family:ui-monospace,Menlo,monospace; resize:vertical;"></textarea>

    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn-cancel" id="importCancel">Cancel</button>
      <button class="btn-primary" id="importGo">Import</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(async function () {
  const TPLS = [
    { key: "blank",              title: "Blank",              desc: "Three empty lanes — start fresh." },
    { key: "product-launch",     title: "Product Launch",     desc: "Discovery → Build → Beta → GA." },
    { key: "saas-quarterly",     title: "SaaS Quarterly",     desc: "Q1–Q4 with Growth / Product / Platform." },
    { key: "engineering-sprint", title: "Engineering Sprint", desc: "Now / Next / Later × FE / BE / Infra." }
  ];

  // ----- No-email share-link join -----
  // Capture a ?join=<token> BEFORE auth. requireAuth() bounces signed-out
  // users to the landing page (dropping the URL + query), so we stash the
  // token in localStorage to survive the Google sign-in round-trip. After
  // sign-in the user lands back on /app.html and we claim it here.
  const PENDING_JOIN_KEY = "roadbook:pendingJoin";
  const joinParam = new URLSearchParams(location.search).get("join");
  if (joinParam) {
    localStorage.setItem(PENDING_JOIN_KEY, joinParam);
    history.replaceState(null, "", "/app.html"); // clean URL so refresh won't re-trigger
  }

  const session = await RoadbookAuth.requireAuth();
  if (!session) return;
  const user = session.user;

  // Now signed in — claim any pending join and jump straight into the editor.
  let joinFailed = false;
  const pendingJoin = localStorage.getItem(PENDING_JOIN_KEY);
  if (pendingJoin) {
    localStorage.removeItem(PENDING_JOIN_KEY);
    const joinedRoadmapId = await RoadbookAPI.claimShareLink(pendingJoin);
    if (joinedRoadmapId) {
      location.href = `/editor.html#${joinedRoadmapId}`;
      return;
    }
    joinFailed = true; // surfaced via toast once it's defined below
  }
  document.getElementById("userEmail").textContent = user.email || "";
  const avatar = document.getElementById("userAvatar");
  if (user.user_metadata?.avatar_url) {
    avatar.style.backgroundImage = `url(${user.user_metadata.avatar_url})`;
  }

  document.getElementById("signOut").addEventListener("click", () => RoadbookAuth.signOut());

  const toast = (msg, error = false) => {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.toggle("error", !!error);
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  };

  if (joinFailed) toast("That share link is invalid or expired.", true);

  function fmtDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const now = new Date();
    const dayMs = 86400000;
    const diff = Math.floor((now - d) / dayMs);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    if (diff < 7) return `${diff} days ago`;
    if (diff < 30) return `${Math.floor(diff / 7)}w ago`;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function previewRows(data) {
    // Show first 3 lanes from the active year with their item segments
    const year = data?.activeYear || "2026";
    const lanes = (data?.data?.[year]?.lanes || []).slice(0, 3);
    const items = data?.data?.[year]?.items || [];
    const totalDays = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 366 : 365;
    return lanes.map((lane) => {
      const segs = items
        .filter((it) => it.laneId === lane.id && it.startDate && it.endDate)
        .map((it) => {
          const startDay = Math.max(1, Math.min(totalDays, dayOfYear(it.startDate)));
          const endDay = Math.max(startDay, Math.min(totalDays, dayOfYear(it.endDate)));
          const leftPct = ((startDay - 1) / totalDays) * 100;
          const widthPct = Math.max(1.5, ((endDay - startDay + 1) / totalDays) * 100);
          return `<span class="seg" style="left:${leftPct}%; width:${widthPct}%;"></span>`;
        })
        .join("");
      return `<div class="row">${segs}</div>`;
    }).join("");
  }

  function dayOfYear(iso) {
    if (!iso || typeof iso !== "string") return 1;
    const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return 1;
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    if (isNaN(d.getTime())) return 1;
    const start = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.floor((d - start) / 86400000) + 1;
  }

  let roadmaps = [];
  let sharedRoadmaps = [];

  async function refresh() {
    [roadmaps, sharedRoadmaps] = await Promise.all([
      RoadbookAPI.list(),
      RoadbookAPI.listSharedWithMe ? RoadbookAPI.listSharedWithMe() : Promise.resolve([])
    ]);
    render();
    renderShared();
  }

  function renderShared() {
    const section = document.getElementById("sharedSection");
    const grid = document.getElementById("sharedGrid");
    if (!section || !grid) return;
    if (!sharedRoadmaps || sharedRoadmaps.length === 0) {
      section.hidden = true;
      grid.innerHTML = "";
      return;
    }
    section.hidden = false;
    grid.innerHTML = "";
    for (const r of sharedRoadmaps) {
      const c = document.createElement("div");
      c.className = "rb-card shared-card";
      c.innerHTML = `
        <div class="rb-title"></div>
        <div class="rb-meta"></div>
        <div class="owner-line" style="font-size:11px;color:#a1a1aa;margin-top:4px;">Shared with you</div>
        <div class="rb-preview">${previewRows(r.data) || '<div class="row"></div><div class="row"></div><div class="row"></div>'}</div>
      `;
      c.querySelector(".rb-title").textContent = r.title || "Untitled";
      c.querySelector(".rb-meta").textContent = `Updated ${fmtDate(r.updated_at)}`;
      c.addEventListener("click", () => { location.href = `/editor.html#${r.id}`; });
      grid.appendChild(c);
    }
  }

  function render() {
    const grid = document.getElementById("grid");
    const sub = document.getElementById("dashSub");
    sub.textContent = roadmaps.length === 0
      ? "Create your first roadmap to get started."
      : `${roadmaps.length} roadmap${roadmaps.length === 1 ? "" : "s"} · last updated ${fmtDate(roadmaps[0].updated_at)}`;

    grid.innerHTML = "";
    // + Create card always first
    const createCard = document.createElement("div");
    createCard.className = "rb-card rb-card-new";
    createCard.innerHTML = `
      <div class="plus-circle">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      </div>
      <div class="label">Create roadmap</div>
      <div class="hint">Start blank or from a template</div>
    `;
    createCard.addEventListener("click", openTemplatePicker);
    grid.appendChild(createCard);

    // Import card
    const importCard = document.createElement("div");
    importCard.className = "rb-card rb-card-new";
    importCard.innerHTML = `
      <div class="plus-circle">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13h10"/></svg>
      </div>
      <div class="label">Import roadmap</div>
      <div class="hint">From JSON file or URL</div>
    `;
    importCard.addEventListener("click", openImport);
    grid.appendChild(importCard);

    for (const r of roadmaps) {
      const c = document.createElement("div");
      c.className = "rb-card";
      c.innerHTML = `
        <div class="rb-actions">
          <button data-action="rename" title="Rename" aria-label="Rename">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.3 2.7a1.5 1.5 0 012.1 2.1L5.5 12.7l-3 1 1-3z"/></svg>
          </button>
          <button data-action="delete" class="danger" title="Delete" aria-label="Delete">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h10M6 5V3h4v2M5 5l0.7 9h4.6l0.7-9"/></svg>
          </button>
        </div>
        <div class="rb-title"></div>
        <div class="rb-meta"></div>
        <div class="rb-preview">${previewRows(r.data) || '<div class="row"></div><div class="row"></div><div class="row"></div>'}</div>
      `;
      c.querySelector(".rb-title").textContent = r.title || "Untitled";
      c.querySelector(".rb-meta").textContent = `Updated ${fmtDate(r.updated_at)}`;
      c.addEventListener("click", (e) => {
        if (e.target.closest("[data-action]")) return; // let action buttons handle their own clicks
        location.href = `/editor.html#${r.id}`;
      });
      c.querySelector('[data-action="rename"]').addEventListener("click", (e) => {
        e.stopPropagation(); openRename(r);
      });
      c.querySelector('[data-action="delete"]').addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete "${r.title || 'Untitled'}"? This cannot be undone.`)) return;
        const ok = await RoadbookAPI.remove(r.id);
        if (ok) { toast("Deleted"); refresh(); }
        else toast("Delete failed", true);
      });
      grid.appendChild(c);
    }
  }

  // ----- Template picker -----
  function openTemplatePicker() {
    const grid = document.getElementById("tplGrid");
    grid.innerHTML = "";
    TPLS.forEach((t) => {
      const b = document.createElement("button");
      b.className = "tpl-card";
      b.innerHTML = `<div class="t"></div><div class="d"></div>`;
      b.querySelector(".t").textContent = t.title;
      b.querySelector(".d").textContent = t.desc;
      b.addEventListener("click", () => createFromTemplate(t.key, t.title));
      grid.appendChild(b);
    });
    document.getElementById("tplOverlay").classList.add("show");
  }
  function closeTpl() { document.getElementById("tplOverlay").classList.remove("show"); }
  document.getElementById("tplCancel").addEventListener("click", closeTpl);
  document.getElementById("tplOverlay").addEventListener("click", (e) => {
    if (e.target.id === "tplOverlay") closeTpl();
  });

  async function createFromTemplate(key, title) {
    const tpl = (window.ROADBOOK_TEMPLATES || {})[key];
    if (!tpl) { toast("Template not available", true); return; }
    closeTpl();
    const payload = JSON.parse(JSON.stringify(tpl));
    // Use a friendly title; preserve template's title only for Blank's default
    const newTitle = key === "blank" ? "Untitled roadmap" : title;
    payload.title = newTitle;
    const row = await RoadbookAPI.create({ title: newTitle, data: payload });
    if (!row) { toast("Could not create roadmap", true); return; }
    location.href = `/editor.html#${row.id}`;
  }

  // ----- Rename -----
  let renamingId = null;
  function openRename(r) {
    renamingId = r.id;
    document.getElementById("renameInput").value = r.title || "";
    document.getElementById("renameOverlay").classList.add("show");
    setTimeout(() => document.getElementById("renameInput").focus(), 40);
  }
  function closeRename() { document.getElementById("renameOverlay").classList.remove("show"); renamingId = null; }
  document.getElementById("renameCancel").addEventListener("click", closeRename);
  document.getElementById("renameOverlay").addEventListener("click", (e) => {
    if (e.target.id === "renameOverlay") closeRename();
  });
  document.getElementById("renameSave").addEventListener("click", async () => {
    if (!renamingId) return;
    const next = document.getElementById("renameInput").value.trim();
    if (!next) return;
    const updated = await RoadbookAPI.update(renamingId, { title: next });
    closeRename();
    if (updated) { toast("Renamed"); refresh(); }
  });
  document.getElementById("renameInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("renameSave").click();
  });

  // ----- Import -----
  function openImport() {
    document.getElementById("importFile").value = "";
    document.getElementById("importText").value = "";
    document.getElementById("importFileName").textContent = "";
    document.getElementById("importOverlay").classList.add("show");
  }
  function closeImport() { document.getElementById("importOverlay").classList.remove("show"); }

  document.getElementById("importCancel").addEventListener("click", closeImport);
  document.getElementById("importOverlay").addEventListener("click", (e) => {
    if (e.target.id === "importOverlay") closeImport();
  });
  document.getElementById("importChooseFile").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    document.getElementById("importFileName").textContent = f ? f.name : "";
  });

  function isLikelyUrl(s) { return /^https?:\/\//i.test(s.trim()); }

  function validateScene(obj) {
    if (!obj || typeof obj !== "object") return "Not a JSON object.";
    if (obj.roadbookVersion !== 3) return "Not a Roadbook v3 scene (missing roadbookVersion: 3).";
    if (!obj.data || typeof obj.data !== "object") return "Missing data.{year} payload.";
    return null;
  }

  async function readPayloadFromInputs() {
    const file = document.getElementById("importFile").files[0];
    const txt = document.getElementById("importText").value.trim();
    if (file) {
      const raw = await file.text();
      return { source: file.name, raw };
    }
    if (txt) {
      if (isLikelyUrl(txt)) {
        const resp = await fetch(txt);
        if (!resp.ok) throw new Error(`Fetch failed: ${resp.status}`);
        const raw = await resp.text();
        return { source: txt, raw };
      }
      return { source: "pasted JSON", raw: txt };
    }
    throw new Error("Choose a file, or paste JSON / a URL.");
  }

  document.getElementById("importGo").addEventListener("click", async () => {
    let payload;
    try {
      const { source, raw } = await readPayloadFromInputs();
      const obj = JSON.parse(raw);
      const err = validateScene(obj);
      if (err) { toast(err, true); return; }
      payload = obj;
      const title = obj.title ? (obj.eyebrow ? `${obj.title} · ${obj.eyebrow}` : obj.title) : ("Imported · " + source);
      const row = await RoadbookAPI.create({ title, data: payload });
      if (!row) { toast("Could not save imported roadmap", true); return; }
      closeImport();
      location.href = `/editor.html#${row.id}`;
    } catch (e) {
      console.error(e);
      toast(e.message || "Import failed", true);
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeTpl(); closeRename(); closeImport(); }
  });

  await refresh();
})();
</script>
</body>
</html>
