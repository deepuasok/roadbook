<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)">
<meta name="description" content="Roadbook — a fork-friendly, offline-first roadmap builder for product managers. Drag chips, share PNG/SVG/link, version in git.">
<title>Roadbook</title>
<style>
/* INJECT:CSS */
</style>
</head>
<body data-theme="light">
<div class="page" id="page">

  <div class="head">
    <div class="head-left">
      <div class="eyebrow" id="eyebrow" contenteditable="true" spellcheck="false" data-placeholder="Product · 2026">Product · 2026</div>
      <h1 id="title" contenteditable="true" spellcheck="false" data-placeholder="Roadmap title">Roadbook</h1>
    </div>
    <div class="head-right">
      <div class="year-pills" id="yearPills" role="tablist" aria-label="Year"></div>
      <div class="head-tools">
        <button class="icon-btn" id="undoBtn" title="Undo (⌘Z)" aria-label="Undo">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h6.5a3 3 0 010 6H6"/><path d="M7 5L4 8l3 3"/></svg>
        </button>
        <button class="icon-btn" id="redoBtn" title="Redo (⌘⇧Z)" aria-label="Redo">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8H5.5a3 3 0 000 6H10"/><path d="M9 5l3 3-3 3"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.5A5 5 0 016.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-actions">
      <button class="icon-btn" id="importBtn" title="Import roadmap from JSON" aria-label="Import JSON">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V2"/><path d="M5 8l3 3 3-3"/><path d="M3 13h10"/></svg>
        Import
      </button>
      <button class="icon-btn" id="exportBtn" title="Export roadmap as JSON" aria-label="Export JSON">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v9"/><path d="M5 8l3 3 3-3"/><path d="M3 13h10"/></svg>
        Export
      </button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <span class="divider" aria-hidden="true"></span>
      <div class="share-wrap">
        <button class="icon-btn" id="shareBtn" title="Share roadmap" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V2"/><path d="M5 5l3-3 3 3"/><path d="M3 10v3a1 1 0 001 1h8a1 1 0 001-1v-3"/></svg>
          Share
          <svg class="caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5l2.5 2.5L8.5 5"/></svg>
        </button>
        <div class="share-menu" id="shareMenu" role="menu" hidden>
          <button class="share-menu-item" id="shareLink" role="menuitem">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9a3 3 0 014.2 0l1.4-1.4a3 3 0 00-4.2-4.2L7 4.8"/><path d="M9 7a3 3 0 01-4.2 0L3.4 8.4a3 3 0 004.2 4.2L9 11.2"/></svg>
            <span class="smi-label">Copy link</span>
            <span class="smi-hint">Encodes the roadmap in a URL</span>
          </button>
          <button class="share-menu-item" id="sharePng" role="menuitem">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="6" cy="7" r="1.2"/><path d="M3 12l3.5-3.5L9 11l2-2 3 3"/></svg>
            <span class="smi-label">Copy PNG</span>
            <span class="smi-hint">Screenshot to clipboard</span>
          </button>
          <button class="share-menu-item" id="shareSvg" role="menuitem">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h10"/><path d="M5 9l3 3 3-3"/><path d="M8 3v9"/></svg>
            <span class="smi-label">Download SVG</span>
            <span class="smi-hint">Vector for slide decks</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="axis">
    <div class="year" id="axisYear">2026</div>
    <div class="months">
      <div class="q">Q1</div><div class="q">Q2</div><div class="q">Q3</div><div class="q">Q4</div>
      <div class="m">Jan</div><div class="m">Feb</div><div class="m">Mar</div>
      <div class="m">Apr</div><div class="m">May</div><div class="m">Jun</div>
      <div class="m">Jul</div><div class="m">Aug</div><div class="m">Sep</div>
      <div class="m">Oct</div><div class="m">Nov</div><div class="m">Dec</div>
    </div>
  </div>

  <div id="lanes" role="list" aria-label="Swim lanes"></div>

  <button class="add-lane-btn" id="addLane">+ Add swim lane</button>

  <div class="controls">
    <button class="btn" id="reset">Templates / Reset</button>
    <button class="btn" id="accentBtn" title="Set accent color">Accent color</button>
    <input type="color" id="accentInput" value="#6366F1" hidden>
    <span class="muted" id="status">Changes auto-save in this browser.</span>
  </div>

  <footer class="footer">
    <span>Roadbook</span>
    <span class="dot-sep">·</span>
    <a href="https://github.com/deepuasok/roadbook" target="_blank" rel="noopener">github</a>
    <span class="dot-sep">·</span>
    <span class="muted">v0.1</span>
  </footer>

</div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal modal-edit">
    <h3 id="modalTitle">Edit item</h3>

    <div class="field">
      <label for="fTitle">Title</label>
      <input type="text" id="fTitle" placeholder="What is this?" />
    </div>

    <div class="field-row">
      <div class="field">
        <label for="fStartDate">Start</label>
        <input type="date" id="fStartDate" />
      </div>
      <div class="field">
        <label for="fEndDate">End</label>
        <input type="date" id="fEndDate" />
      </div>
    </div>
    <div class="duration-hint" id="fDurationHint">14 days</div>

    <div class="field">
      <label>Status</label>
      <div class="chip-group" id="fStatusGroup" role="radiogroup" aria-label="Status">
        <button type="button" class="chip" data-value="planned" role="radio">
          <span class="chip-dot dot-planned"></span><span>Planned</span>
        </button>
        <button type="button" class="chip" data-value="funded" role="radio">
          <span class="chip-dot dot-funded"></span><span>Funded</span>
        </button>
        <button type="button" class="chip" data-value="soon" role="radio">
          <span class="chip-dot dot-soon"></span><span>Coming soon</span>
        </button>
        <button type="button" class="chip" data-value="pending" role="radio">
          <span class="chip-dot dot-pending"></span><span>Pending</span>
        </button>
        <button type="button" class="chip" data-value="conditional" role="radio">
          <span class="chip-dot dot-conditional"></span><span>If capacity</span>
        </button>
        <button type="button" class="chip" data-value="deprioritized" role="radio">
          <span class="chip-dot dot-deprioritized"></span><span>Deprioritized</span>
        </button>
      </div>
    </div>

    <div class="field">
      <label>Type</label>
      <div class="chip-group" id="fTypeGroup" role="radiogroup" aria-label="Type">
        <button type="button" class="chip chip-type" data-value="other" role="radio">
          <span class="chip-stripe stripe-none"></span><span>None</span>
        </button>
        <button type="button" class="chip chip-type" data-value="build" role="radio">
          <span class="chip-stripe stripe-build"></span><span>Build</span>
        </button>
        <button type="button" class="chip chip-type" data-value="data" role="radio">
          <span class="chip-stripe stripe-data"></span><span>Data</span>
        </button>
        <button type="button" class="chip chip-type" data-value="polish" role="radio">
          <span class="chip-stripe stripe-polish"></span><span>Polish</span>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="fComplete">Completion <span class="aux pct-chip" id="fCompleteVal">0%</span></label>
      <div class="slider-wrap">
        <input type="range" id="fComplete" min="0" max="100" step="5" />
      </div>
    </div>

    <div class="field">
      <label for="fBusinessObjective">Business Objective</label>
      <textarea id="fBusinessObjective" rows="3" placeholder="Why does this matter? What outcome or metric does it move?"></textarea>
    </div>

    <div class="field">
      <label for="fDefinitionOfDone">Definition of Done</label>
      <textarea id="fDefinitionOfDone" rows="3" placeholder="What must be true for this to count as complete?"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn danger" id="mDelete">Remove</button>
      <div class="spacer"></div>
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn primary" id="mSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="templateOverlay" role="dialog" aria-modal="true" aria-labelledby="templateTitle">
  <div class="modal modal-wide">
    <h3 id="templateTitle">Start with a template</h3>
    <p class="modal-sub">Pick a starter, or start blank. Your current roadmap will be replaced.</p>
    <div class="template-grid" id="templateGrid"></div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn" id="tCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* INJECT:TEMPLATES */
</script>
<script>
/* INJECT:JS */
</script>
</body>
</html>
